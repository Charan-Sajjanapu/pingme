services:
  frontend:
    image : node:latest
    ports:
      - "3100:3100"
    working_dir: /app
    container_name: frontend
    volumes:
      - ./frontend:/app
    command: sh -c "sleep infinity"

  backend:
    image : node:latest
    ports:
      - "3000:3000"
    working_dir: /app
    container_name: backend
    volumes:
      - ./backend:/app
    command: sh -c "sleep infinity"